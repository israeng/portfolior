<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Conceptual visual: six people in a queue, three minutes each, two providers, giving a nine minute wait"><rect width="400" height="300" fill="#10181a"/><g fill="#3fd0c0"><circle cx="60" cy="70" r="14"/><circle cx="110" cy="70" r="14"/><circle cx="160" cy="70" r="14"/><circle cx="210" cy="70" r="14"/><circle cx="260" cy="70" r="14"/><circle cx="310" cy="70" r="14"/></g><path d="M40 110h320" stroke="#2a3335" stroke-dasharray="4 6"/><text x="200" y="165" text-anchor="middle" fill="#eef2f0" font-family="Georgia,serif" font-size="34">6 × 3 ÷ 2 = 9 min</text><circle cx="200" cy="230" r="0" fill="none"/><text x="200" y="215" text-anchor="middle" fill="#a3b0ad" font-family="system-ui,sans-serif" font-size="14" direction="rtl">ليش أنا أنتظر؟</text><text x="200" y="260" text-anchor="middle" fill="#3fd0c0" font-family="Georgia,serif" font-size="22">Why Am I Waiting?</text></svg>
